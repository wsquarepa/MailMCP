# MailMCP configuration template.
# Copy this file to config.yml, then uncomment and edit the blocks you need;
# nothing in this file is active until uncommented.
#
# - `${VAR}` values are interpolated from environment variables at load time.
# - `secure: true` means implicit TLS.
# - Permission vocabulary: read, draft, send, organize, delete (docs/permission.md).
#
# A configuration needs at least one mailbox and one key.

# mailboxes:
#
#   # An IMAP/SMTP mailbox.
#   personal:
#     backend: imap
#     address: "Display Name <you@example.com>"
#     imap: { host: imap.example.com, port: 993, secure: true, user: you@example.com, pass: "${IMAP_PASS_PERSONAL}" }
#     smtp: { host: smtp.example.com, port: 465, secure: true, user: you@example.com, pass: "${IMAP_PASS_PERSONAL}" }
#     # Optional: provider-specific headers to surface in message views.
#     surface_headers: [X-Spam-Score]
#
#   # A Microsoft Graph mailbox (app registration and auth: docs/graph.md).
#   work:
#     backend: graph
#     address: "Display Name <you@example.edu>"
#     graph: { tenant_id: "<azure tenant id>", client_id: "<azure app client id>" }
#
#   # `public` grants baseline permissions on this mailbox to every key.
#   shared:
#     backend: imap
#     address: "Agent Pool <shared@example.com>"
#     imap: { host: imap.example.com, port: 993, secure: true, user: shared@example.com, pass: "${IMAP_PASS_SHARED}" }
#     smtp: { host: smtp.example.com, port: 465, secure: true, user: shared@example.com, pass: "${IMAP_PASS_SHARED}" }
#     public: [read, draft]

# keys:
#
#   # One entry per agent; `name` appears in logs and permission errors.
#   - name: my-agent
#     token: "${MCP_KEY_MY_AGENT}"
#     default_mailbox: personal
#     # Effective permissions = the mailbox's `public` list union these grants.
#     grants:
#       personal: [read, draft, send, organize, delete]
#       work: [read, organize]
