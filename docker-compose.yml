services:
  mailmcp:
    image: ghcr.io/wsquarepa/mailmcp:edge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MAILMCP_CONFIG: /data/config.yml
      PORT: "8080"
      GRAPH_TOKEN_CACHE_DIR: /data/graph-tokens
      # Every ${VAR} referenced in config.yml must be provided here (or via an
      # env file), for example:
      # IMAP_PASS_HERMES: ${IMAP_PASS_HERMES}
      # IMAP_PASS_SHARED: ${IMAP_PASS_SHARED}
      # MCP_KEY_HERMES: ${MCP_KEY_HERMES}
    volumes:
      - ./config.yml:/data/config.yml:ro
      - ./graph-tokens:/data/graph-tokens
